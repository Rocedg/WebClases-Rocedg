{% extends "base.html" %}

{% block title %}Cambiar contraseña{% endblock %}

{% block content %}
<section class="section-shell">
    <div class="panel-card account-card">
        <span class="eyebrow">
            <i class="fas fa-key" aria-hidden="true"></i>
            Cuenta
        </span>
        <h1 class="page-title fs-1">Cambiar contraseña</h1>
        <p class="page-copy mb-4">
            Actualiza la contraseña de <strong>{{ session.username }}</strong>.
        </p>

        {% if error %}
        <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}
        {% if success %}
        <div class="alert alert-success" role="status">{{ success }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('account_password') }}">
            <div class="mb-3">
                <label for="username" class="form-label fw-bold">Usuario</label>
                <input type="text" class="form-control form-control-lg" id="username"
                       value="{{ session.username }}" readonly>
            </div>
            <div class="mb-3">
                <label for="current_password" class="form-label fw-bold">Contraseña actual</label>
                <input type="password" class="form-control form-control-lg"
                       id="current_password" name="current_password" required>
            </div>
            <div class="mb-3">
                <label for="new_password" class="form-label fw-bold">Nueva contraseña</label>
                <input type="password" class="form-control form-control-lg"
                       id="new_password" name="new_password" required>
            </div>
            <div class="mb-4">
                <label for="repeated_password" class="form-label fw-bold">Repite la nueva contraseña</label>
                <input type="password" class="form-control form-control-lg"
                       id="repeated_password" name="repeated_password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100">
                <i class="fas fa-key me-1" aria-hidden="true"></i>Actualizar contraseña
            </button>
        </form>
    </div>
</section>
{% endblock %}
