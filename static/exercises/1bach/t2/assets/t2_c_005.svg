<title id="title">Giro horario de radio 2 m con periodo 4 s</title>
<desc id="desc">Circunferencia a escala de radio 2 m centrada en O, con ejes x e y en metros. El móvil sale en t = 0 del punto (0; 2) m, en lo alto, y gira en sentido horario con periodo 4 s. Un pequeño arco junto a O indica que el ángulo θ se mide desde +x y es positivo en sentido antihorario.</desc>
