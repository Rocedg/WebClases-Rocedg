  <defs><marker id="arrow-c" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs>
  <rect width="520" height="290" fill="white"/>
  <g font-family="Arial, sans-serif" fill="#203148">
    <path d="M55 145H468M260 250V38" fill="none" stroke="#536579" stroke-width="1.6" marker-end="url(#arrow-c)"/>
    <text x="471" y="164" font-size="14">x (m)</text><text x="272" y="45" font-size="14">y (m)</text>
    <circle cx="260" cy="145" r="86" fill="#f7faff" stroke="#245b99" stroke-width="2.5"/>
    <circle cx="260" cy="145" r="3.5" fill="#203148"/><text x="270" y="161" font-size="14">O</text>
