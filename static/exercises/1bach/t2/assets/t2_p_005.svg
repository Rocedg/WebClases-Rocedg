<title id="title">Proyectil lanzado con velocidad (12; 16) m/s</title>
<desc id="desc">Esquema sin escala del plano vertical. El proyectil sale de O, en el suelo, con velocidad (12; 16) m/s, hacia arriba y a la derecha, sube hasta un punto más alto y vuelve al suelo más a la derecha. La gravedad apunta hacia abajo. No se marca el punto más alto.</desc>
