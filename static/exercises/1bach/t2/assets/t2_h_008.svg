<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">Salida horizontal hacia una rampa ascendente</title>
<desc id="desc">Esquema sin escala del plano vertical. La bola sale horizontalmente hacia +x a 6 m/s desde (0; 10) m, en lo alto de una plataforma cuya cara derecha está sobre el eje y. Desde el origen O sube hacia la derecha una rampa recta, y = x/2. La bola describe media parábola hasta tocar la rampa; el punto de contacto no se indica. La gravedad apunta hacia abajo.</desc>
