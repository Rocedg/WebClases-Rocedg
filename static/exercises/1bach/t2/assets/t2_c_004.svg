<title id="title">MCU de radio 3 m en sentido antihorario</title>
<desc id="desc">Circunferencia a escala de radio 3 m centrada en O, con ejes x e y en metros. El móvil gira en sentido antihorario con rapidez constante de 6 m/s. Están marcados los dos puntos del apartado (b): (3; 0) m, sobre el semieje +x, y (0; −3) m, sobre el semieje −y. No se dibujan los vectores velocidad ni aceleración.</desc>
