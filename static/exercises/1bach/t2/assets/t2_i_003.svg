<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">Diana elevada bajo un techo a 4 m</title>
<desc id="desc">Esquema sin escala del plano vertical. Un lanzador en O, en el suelo, dispara proyectiles a 10 m/s con un ángulo θ por determinar. Hay una diana en (5; 1,25) m y un techo horizontal a y = 4 m. No se dibujan trayectorias.</desc>
