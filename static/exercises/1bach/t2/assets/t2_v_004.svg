<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">Velocidad inicial y final de un móvil</title>
<desc id="desc">Plano de velocidades a escala, con ejes vx y vy en m/s; +x hacia el este y +y hacia el norte. Desde el origen salen dos flechas: la velocidad inicial (6; 0) m/s, sobre el semieje +vx, y la velocidad 2 s después, (0; 8) m/s, sobre el semieje +vy. No se dibuja la variación de velocidad.</desc>
