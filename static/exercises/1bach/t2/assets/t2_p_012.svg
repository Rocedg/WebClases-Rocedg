<title id="title">Pelota lanzada desde 4 m con velocidad (6; 8) m/s</title>
<desc id="desc">Esquema sin escala del plano vertical. La pelota sale de (0; 4) m, en lo alto de una plataforma de 4 m cuya cara derecha está sobre el eje y, con el origen O a su pie. Su velocidad inicial es (6; 8) m/s, hacia arriba y a la derecha. Sube, pasa por la cima y llega al suelo más a la derecha. La gravedad apunta hacia abajo.</desc>
