<title id="title">Salida horizontal a 5 m/s con alcance 7,5 m</title>
<desc id="desc">Esquema sin escala del plano vertical. Una plataforma de altura h desconocida tiene su cara derecha sobre el eje y y el origen O a su pie. La bola sale horizontalmente hacia +x a 5 m/s y llega al suelo a 7,5 m del pie de la plataforma. La gravedad apunta hacia abajo.</desc>
