<title id="title">Dos puntos de un disco a 0,1 m y 0,3 m del centro</title>
<desc id="desc">Esquema sin escala. Un disco gira alrededor de su centro O en sentido antihorario. Sobre un mismo radio están marcados el punto A, a 0,1 m del centro, y el punto B, a 0,3 m. Unas circunferencias discontinuas muestran el camino de cada punto.</desc>
