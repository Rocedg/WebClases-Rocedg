<title id="title">Pelota lanzada desde 5 m con velocidad (6; 10) m/s</title>
<desc id="desc">Esquema sin escala del plano vertical. La pelota sale de (0; 5) m, en lo alto de una plataforma de 5 m cuya cara derecha está sobre el eje y, con el origen O a su pie. Su velocidad inicial es (6; 10) m/s, hacia arriba y a la derecha. Sube, pasa por la cima y llega al suelo más a la derecha. La gravedad apunta hacia abajo.</desc>
