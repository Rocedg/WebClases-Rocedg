<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">Trayectoria de r(t) = (t² − 4t; 3t + 2) entre 0 y 4 s</title>
<desc id="desc">Esquema sin escala del plano xy. La trayectoria del robot empieza en t = 0 en el punto (0; 2) m, sobre el eje y, se desplaza hacia x negativa mientras sube, gira y vuelve al eje y, en el punto que ocupa en t = 4 s, más arriba. Tiene forma de parábola abierta hacia +x. No se marca el punto de giro.</desc>
