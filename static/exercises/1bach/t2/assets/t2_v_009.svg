<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">Un mismo cruce descrito con dos referencias</title>
<desc id="desc">Esquema sin escala en dos paneles. Los dos muestran el mismo río, de 40 m de ancho, visto en planta: la corriente va hacia la derecha a 1,5 m/s y la barca apunta perpendicularmente a la otra orilla, a 2,5 m/s respecto al agua. Referencia A: +x hacia la derecha, en el sentido de la corriente, y +y hacia la otra orilla. Referencia B: +x hacia la otra orilla y +y hacia la izquierda, contra la corriente.</desc>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1f5fa8"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b8432f"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#16756a"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6d4fb0"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#55657a"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1f2d44"/></marker></defs>
<rect width="640" height="360" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2d44" stroke-linecap="round" stroke-linejoin="round">
<text x="20.0" y="40.0" font-size="15" font-weight="bold">Referencia A</text>
<rect x="20" y="70" width="290" height="230" fill="#e6f0fa"/>
<path d="M20.0 70.0L310.0 70.0" fill="none" stroke="#16756a" stroke-width="3"/>
<path d="M20.0 300.0L310.0 300.0" fill="none" stroke="#16756a" stroke-width="3"/>
<path d="M195.0 112.0L265.0 112.0" fill="none" stroke="#1f5fa8" stroke-width="2.6" marker-end="url(#ah-blue)"/>
<text x="230.0" y="102.0" text-anchor="middle" fill="#1f5fa8" font-weight="bold" stroke="#ffffff" stroke-width="4" paint-order="stroke">1,5 m/s</text>
<path d="M90.0 300.0L90.0 210.0" fill="none" stroke="#b8432f" stroke-width="3" marker-end="url(#ah-red)"/>
<text x="100.0" y="230.0" fill="#b8432f" font-weight="bold" stroke="#ffffff" stroke-width="4" paint-order="stroke">2,5 m/s</text>
<text x="100.0" y="248.0" fill="#b8432f" font-size="12" stroke="#ffffff" stroke-width="4" paint-order="stroke">(resp. agua)</text>
<path d="M220.0 260.0L270.0 260.0" fill="none" stroke="#1f2d44" stroke-width="2" marker-end="url(#ah-ink)"/>
<text x="274.0" y="265.0" font-weight="bold">+x</text>
<path d="M220.0 260.0L220.0 210.0" fill="none" stroke="#1f2d44" stroke-width="2" marker-end="url(#ah-ink)"/>
<text x="214.0" y="204.0" font-weight="bold">+y</text>
<text x="310.0" y="320.0" text-anchor="end" fill="#55657a" font-size="13">40 m entre orillas</text>
<text x="330.0" y="40.0" font-size="15" font-weight="bold">Referencia B</text>
<rect x="330" y="70" width="290" height="230" fill="#e6f0fa"/>
<path d="M330.0 70.0L620.0 70.0" fill="none" stroke="#16756a" stroke-width="3"/>
<path d="M330.0 300.0L620.0 300.0" fill="none" stroke="#16756a" stroke-width="3"/>
<path d="M505.0 112.0L575.0 112.0" fill="none" stroke="#1f5fa8" stroke-width="2.6" marker-end="url(#ah-blue)"/>
<text x="540.0" y="102.0" text-anchor="middle" fill="#1f5fa8" font-weight="bold" stroke="#ffffff" stroke-width="4" paint-order="stroke">1,5 m/s</text>
<path d="M400.0 300.0L400.0 210.0" fill="none" stroke="#b8432f" stroke-width="3" marker-end="url(#ah-red)"/>
<text x="410.0" y="230.0" fill="#b8432f" font-weight="bold" stroke="#ffffff" stroke-width="4" paint-order="stroke">2,5 m/s</text>
<text x="410.0" y="248.0" fill="#b8432f" font-size="12" stroke="#ffffff" stroke-width="4" paint-order="stroke">(resp. agua)</text>
<path d="M530.0 260.0L530.0 210.0" fill="none" stroke="#1f2d44" stroke-width="2" marker-end="url(#ah-ink)"/>
<text x="524.0" y="204.0" font-weight="bold">+x</text>
<path d="M530.0 260.0L480.0 260.0" fill="none" stroke="#1f2d44" stroke-width="2" marker-end="url(#ah-ink)"/>
<text x="456.0" y="265.0" font-weight="bold">+y</text>
<text x="620.0" y="320.0" text-anchor="end" fill="#55657a" font-size="13">40 m entre orillas</text>
<text x="630.0" y="352.0" text-anchor="end" fill="#55657a" font-size="12" font-style="italic">Esquema sin escala</text>
</g>
</svg>
