<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">Curva común de dos móviles</title>
<desc id="desc">Esquema sin escala del plano xy. Una sola curva sale del origen O y sube hacia la derecha, cada vez más inclinada. Está marcado el punto (1; 1) m. Los móviles A y B parten de O y recorren la curva: A, con r = (t; t²), entre 0 y 2 s; B, con r = (2t; 4t²), entre 0 y 1 s.</desc>
