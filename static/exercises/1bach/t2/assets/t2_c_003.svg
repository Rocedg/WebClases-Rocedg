<title id="title">MCU de radio 2 m a 4 m/s</title>
<desc id="desc">Circunferencia a escala de radio 2 m centrada en O, con ejes x e y en metros. El móvil la recorre en sentido antihorario con rapidez constante de 4 m/s. Están marcados los cuatro puntos del apartado (a): (2; 0), (0; 2), (−2; 0) y (0; −2) m. No se dibujan las velocidades.</desc>
