<title id="title">Pelota lanzada desde una grada de 7,2 m</title>
<desc id="desc">Esquema sin escala del plano vertical. La pelota sale de (0; 7,2) m, en lo alto de una grada de 7,2 m cuya cara derecha está sobre el eje y, con el origen O a su pie. Su velocidad inicial es (12; 9) m/s, de 15 m/s, hacia arriba y a la derecha. Sube, pasa por la cima y llega al suelo más a la derecha. La gravedad apunta hacia abajo.</desc>
