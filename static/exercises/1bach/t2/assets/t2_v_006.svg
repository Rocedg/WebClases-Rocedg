<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">Velocidad de 10 m/s con rumbo 150°</title>
<desc id="desc">Esquema sin escala. Ejes x e y con +x hacia el este y +y hacia el norte. La velocidad del dron, de 10 m/s, apunta hacia arriba y a la izquierda (hacia el noroeste) y forma 150° con el semieje +x, medidos en sentido antihorario. No se dibujan sus componentes.</desc>
