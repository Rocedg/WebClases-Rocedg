<title id="title">Disco que gira a 90 rpm</title>
<desc id="desc">Esquema sin escala. Un disco centrado en el origen O, en el plano xy, gira uniformemente a 90 rpm en sentido antihorario, que es el sentido positivo. Un radio marcado sirve de referencia.</desc>
