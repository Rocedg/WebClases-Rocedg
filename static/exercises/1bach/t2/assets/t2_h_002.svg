<title id="title">Bola que sale de una mesa de 1,8 m</title>
<desc id="desc">Esquema sin escala del plano vertical. Una mesa de 1,8 m de altura tiene su borde sobre el eje y y el origen O a su pie. La bola sale horizontalmente hacia +x con una velocidad v₀ desconocida y cae en una marca del suelo situada a 2,4 m del pie de la mesa. La gravedad apunta hacia abajo.</desc>
