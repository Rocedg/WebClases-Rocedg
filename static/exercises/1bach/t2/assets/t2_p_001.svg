<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">Lanzamiento a 20 m/s y 120°</title>
<desc id="desc">Esquema sin escala del plano vertical. La pelota sale de O con una velocidad de 20 m/s que apunta hacia arriba y a la izquierda, formando 120° con el semieje +x, medidos en sentido antihorario. La gravedad apunta hacia abajo. No se dibujan las componentes.</desc>
