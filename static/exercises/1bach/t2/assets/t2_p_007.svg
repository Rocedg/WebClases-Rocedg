<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">Vuelo desde un balcón de 15 m</title>
<desc id="desc">Esquema sin escala del plano vertical. Un balcón de 15 m de altura tiene su cara sobre el eje y y el origen O en el suelo, a su pie. La pelota sale de (0; 15) m con velocidad (10; 10) m/s, hacia arriba y a la derecha a 45°. Una línea discontinua marca el nivel del balcón. La trayectoria es una parábola que sube por encima de ese nivel, baja y llega al suelo a la derecha del balcón. La gravedad apunta hacia abajo.</desc>
