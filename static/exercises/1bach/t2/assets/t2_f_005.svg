<title id="title">Bola lanzada horizontalmente desde 20 m</title>
<desc id="desc">Esquema sin escala del plano vertical. Una plataforma de 20 m de altura tiene su cara derecha sobre el eje y y el origen O a su pie. La bola sale horizontalmente hacia +x desde (0; 20) m a 4 m/s y describe media parábola hasta el suelo. Una línea discontinua marca la altura y = 15 m. La gravedad apunta hacia abajo.</desc>
