<title id="title">Pelota lanzada desde 6 m con velocidad (8; 5) m/s</title>
<desc id="desc">Esquema sin escala del plano vertical. La pelota sale de (0; 6) m, en lo alto de una plataforma de 6 m cuya cara derecha está sobre el eje y, con el origen O a su pie. Su velocidad inicial es (8; 5) m/s, hacia arriba y a la derecha. Sube un poco, baja y llega al suelo más a la derecha. La gravedad apunta hacia abajo.</desc>
