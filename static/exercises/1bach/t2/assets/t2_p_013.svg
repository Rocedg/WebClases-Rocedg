<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">Proyectil lanzado desde el pie de una rampa</title>
<desc id="desc">Esquema sin escala del plano vertical. Desde el origen O, al pie de una rampa recta que sube hacia la derecha con superficie y = 0,5x, sale un proyectil con velocidad (10; 15) m/s. Describe una parábola por encima de la rampa y vuelve a tocarla más arriba; el punto de contacto no se indica. La gravedad apunta hacia abajo.</desc>
