<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">Trayectoria que cruza dos veces y = 6 m</title>
<desc id="desc">Esquema sin escala del plano vertical. La trayectoria es una parábola que sale de O, sube hasta una altura máxima mayor que 6 m y vuelve a y = 0. Una línea horizontal discontinua marca la altura y = 6 m, que la parábola cruza dos veces: una al subir y otra al bajar. La diana, en (9; 6) m, está en el cruce de bajada.</desc>
