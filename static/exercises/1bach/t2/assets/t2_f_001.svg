<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">Trayectoria r(t) = (1 + 2t; 4 − t²) entre 0 y 3 s</title>
<desc id="desc">Gráfica a escala del plano xy, en metros. La trayectoria es una parábola que empieza en (1; 4) m en t = 0 y avanza hacia la derecha bajando cada vez más deprisa hasta (7; −5) m en t = 3 s. No se marcan las posiciones en t = 1 s ni en t = 2 s.</desc>
