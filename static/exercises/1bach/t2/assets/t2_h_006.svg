<title id="title">Salida horizontal desde 12,8 m a 8 m/s</title>
<desc id="desc">Esquema sin escala del plano vertical. Una plataforma de 12,8 m de altura tiene su cara derecha sobre el eje y y el origen O a su pie. La bola sale horizontalmente hacia +x a 8 m/s y describe media parábola hasta el suelo. La gravedad apunta hacia abajo.</desc>
