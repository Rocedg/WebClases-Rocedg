<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">Lanzamiento desde una plataforma en movimiento</title>
<desc id="desc">Esquema sin escala del plano vertical en t = 0. Una plataforma de 5 m de altura avanza hacia la derecha a 4 m/s respecto al suelo; su borde está en x = 0 y el origen O en el suelo, bajo el borde. Desde el borde se lanza una bola horizontalmente hacia delante a 3 m/s respecto a la plataforma. La gravedad apunta hacia abajo. No se dibuja la trayectoria.</desc>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1f5fa8"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b8432f"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#16756a"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6d4fb0"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#55657a"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1f2d44"/></marker></defs>
<rect width="640" height="360" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2d44" stroke-linecap="round" stroke-linejoin="round">
<text x="304.0" y="279.0" text-anchor="end" font-weight="bold">O</text>
<path d="M40.0 261.0L594.0 261.0" fill="none" stroke="#55657a" stroke-width="1.6" marker-end="url(#ah-muted)"/>
<path d="M310.0 309.0L310.0 37.0" fill="none" stroke="#55657a" stroke-width="1.6" marker-end="url(#ah-muted)"/>
<text x="600.0" y="266.0" font-size="14">x (m)</text>
<text x="318.0" y="45.0" font-size="14">y (m)</text>
<rect x="160.0" y="111.0" width="150" height="132.0" fill="#eef2f7" stroke="#55657a" stroke-width="1.5"/>
<circle cx="182.0" cy="252.0" r="9" fill="#ffffff" stroke="#55657a" stroke-width="2"/>
<circle cx="288.0" cy="252.0" r="9" fill="#ffffff" stroke="#55657a" stroke-width="2"/>
<path d="M190.0 151.0L280.0 151.0" fill="none" stroke="#16756a" stroke-width="3" marker-end="url(#ah-green)"/>
<text x="235.0" y="175.0" text-anchor="middle" fill="#16756a" font-weight="bold" stroke="#ffffff" stroke-width="4" paint-order="stroke">plataforma: 4 m/s</text>
<text x="235.0" y="193.0" text-anchor="middle" fill="#16756a" font-size="13" stroke="#ffffff" stroke-width="4" paint-order="stroke">respecto al suelo</text>
<path d="M146.0 261.0L146.0 111.0" fill="none" stroke="#1f2d44" stroke-width="1.4" marker-start="url(#ah-ink)" marker-end="url(#ah-ink)"/>
<text x="139.0" y="191.0" text-anchor="end" stroke="#ffffff" stroke-width="4" paint-order="stroke">5 m</text>
<circle cx="310.0" cy="111.0" r="6" fill="#1f5fa8"/>
<path d="M310.0 111.0L370.0 111.0" fill="none" stroke="#b8432f" stroke-width="3" marker-end="url(#ah-red)"/>
<text x="376.0" y="116.0" fill="#b8432f" font-weight="bold" stroke="#ffffff" stroke-width="4" paint-order="stroke">bola: 3 m/s respecto a la plataforma</text>
<path d="M535.0 171.0L535.0 205.0" fill="none" stroke="#1f2d44" stroke-width="2.2" marker-end="url(#ah-ink)"/>
<text x="543.0" y="197.0" font-size="16" font-style="italic">g</text>
<text x="630.0" y="352.0" text-anchor="end" fill="#55657a" font-size="12" font-style="italic">Esquema sin escala</text>
</g>
</svg>
