<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">Dron que debe ir justo al norte con viento del oeste</title>
<desc id="desc">Esquema sin escala en vista horizontal, con +x hacia el este y +y hacia el norte. El dron sale del origen O y debe llegar al punto (0; 240) m, justo al norte; una línea discontinua marca ese trayecto. Sopla un viento de (6; 0) m/s hacia el este. No se dibuja la velocidad del dron respecto al aire.</desc>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1f5fa8"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b8432f"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#16756a"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6d4fb0"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#55657a"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1f2d44"/></marker></defs>
<rect width="640" height="360" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2d44" stroke-linecap="round" stroke-linejoin="round">
<text x="304.0" y="309.0" text-anchor="end" font-weight="bold">O</text>
<path d="M155.5 291.0L478.5 291.0" fill="none" stroke="#55657a" stroke-width="1.6" marker-end="url(#ah-muted)"/>
<path d="M310.0 320.0L310.0 26.0" fill="none" stroke="#55657a" stroke-width="1.6" marker-end="url(#ah-muted)"/>
<text x="484.5" y="296.0" font-size="14">x (m)</text>
<text x="318.0" y="34.0" font-size="14">y (m)</text>
<path d="M310.0 291.0L310.0 59.3" fill="none" stroke="#55657a" stroke-width="2" stroke-dasharray="6 5"/>
<circle cx="310.0" cy="59.3" r="6" fill="#1f5fa8"/>
<text x="322.0" y="64.3" fill="#1f5fa8" font-weight="bold" stroke="#ffffff" stroke-width="4" paint-order="stroke">destino (0; 240) m</text>
<circle cx="310.0" cy="291.0" r="5" fill="#1f5fa8"/>
<path d="M174.8 175.2L252.1 175.2" fill="none" stroke="#16756a" stroke-width="3" marker-end="url(#ah-green)"/>
<path d="M174.8 213.8L252.1 213.8" fill="none" stroke="#16756a" stroke-width="3" marker-end="url(#ah-green)"/>
<text x="213.4" y="163.2" text-anchor="middle" fill="#16756a" font-weight="bold" stroke="#ffffff" stroke-width="4" paint-order="stroke">viento: (6; 0) m/s</text>
<text x="470.0" y="150.0" font-weight="bold">Datos</text>
<text x="470.0" y="178.0">rapidez respecto</text>
<text x="470.0" y="206.0">al aire: 10 m/s</text>
<text x="630.0" y="22.0" text-anchor="end" fill="#55657a" font-size="13">+x: este · +y: norte</text>
<text x="630.0" y="352.0" text-anchor="end" fill="#55657a" font-size="12" font-style="italic">Esquema sin escala</text>
</g>
</svg>
