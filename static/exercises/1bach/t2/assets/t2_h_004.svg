<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">Dos bolas lanzadas horizontalmente desde 5 m</title>
<desc id="desc">Esquema sin escala del plano vertical. Desde lo alto de una plataforma de 5 m, con el origen O a su pie, salen a la vez dos bolas horizontalmente hacia +x: A a 3 m/s y B a 6 m/s. Las dos describen medias parábolas hasta el suelo; la de B llega más lejos. La gravedad apunta hacia abajo.</desc>
