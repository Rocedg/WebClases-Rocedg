<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">Dos tiros a 20 m/s que llegan a la diana (20; 5) m</title>
<desc id="desc">Esquema sin escala del plano vertical. Desde O, en el suelo, se lanzan proyectiles a 20 m/s hacia una diana situada en (20; 5) m. Se dibujan dos trayectorias que llegan a la diana: un tiro bajo, casi tendido, y un tiro alto, mucho más curvado. No se indican los ángulos. La gravedad apunta hacia abajo.</desc>
