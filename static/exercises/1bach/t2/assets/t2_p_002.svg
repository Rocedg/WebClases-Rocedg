<title id="title">Salida desde el punto (3; 2) m</title>
<desc id="desc">Esquema sin escala del plano vertical. El origen O está en el suelo, y = 0, y la pelota sale del punto (3; 2) m, marcado con líneas discontinuas hasta los ejes. Su velocidad inicial es (8; 6) m/s, hacia arriba y a la derecha. La trayectoria es una parábola que llega al suelo más a la derecha. La gravedad apunta hacia abajo.</desc>
