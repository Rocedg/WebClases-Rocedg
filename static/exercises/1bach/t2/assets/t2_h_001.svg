<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">Salida horizontal desde 20 m a 6 m/s</title>
<desc id="desc">Esquema sin escala del plano vertical. Una plataforma de 20 m de altura tiene su cara derecha sobre el eje y y el origen O a su pie. La bola sale horizontalmente hacia +x desde lo alto, a 6 m/s, y describe media parábola hasta el suelo. La gravedad apunta hacia abajo. No se indican el tiempo ni el alcance.</desc>
