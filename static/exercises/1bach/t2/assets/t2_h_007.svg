<title id="title">Salida horizontal desde 5 m a 2 m/s</title>
<desc id="desc">Esquema sin escala del plano vertical. Una plataforma de 5 m de altura tiene su cara derecha sobre el eje y y el origen O a su pie. La bola sale horizontalmente hacia +x a 2 m/s y describe media parábola hasta el suelo. La gravedad apunta hacia abajo.</desc>
