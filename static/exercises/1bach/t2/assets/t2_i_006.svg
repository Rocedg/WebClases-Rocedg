<title id="title">Tiro horizontal reconstruido desde el impacto</title>
<desc id="desc">Esquema sin escala del plano vertical. Una bola sale horizontalmente hacia +x desde lo alto de una plataforma de altura h desconocida, con el origen O a su pie. Al llegar al suelo su velocidad tiene módulo 13 m/s y apunta hacia abajo y a la derecha; su componente horizontal es de 5 m/s. La gravedad apunta hacia abajo.</desc>
