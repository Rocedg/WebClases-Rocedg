<title id="title">Balón lanzado a 18 m/s y 30°</title>
<desc id="desc">Esquema sin escala del plano vertical. El balón sale de O, en el suelo, a 18 m/s y con un ángulo de 30° sobre la horizontal, describe una parábola y vuelve al suelo más a la derecha. La gravedad apunta hacia abajo. No se indican el tiempo de vuelo ni el alcance.</desc>
