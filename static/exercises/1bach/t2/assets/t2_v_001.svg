<title id="title">Posición de un dron en el segundo cuadrante</title>
<desc id="desc">Plano xy a escala, en metros, con +x hacia el este y +y hacia el norte. El dron está en el punto P (−6; 8) m, en el segundo cuadrante, al noroeste del origen O. Una flecha va de O a P. No se marca el ángulo.</desc>
