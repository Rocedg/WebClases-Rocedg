<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">Lanzamientos a 30° y a 60° con la misma rapidez</title>
<desc id="desc">Esquema sin escala del plano vertical. Desde O, en el suelo, salen dos proyectiles a 10 m/s: uno a 30° y otro a 60° sobre la horizontal. El de 60° sube más alto; los dos vuelven al suelo en el mismo punto. La gravedad apunta hacia abajo.</desc>
