<title id="title">Rueda de radio 0,25 m</title>
<desc id="desc">Esquema sin escala. Una rueda de radio 0,25 m gira con MCU alrededor de su centro O, en sentido antihorario. Está marcado el punto del borde que empieza en (0,25; 0) m, sobre el semieje +x. La rueda da 10 vueltas en 5 s.</desc>
