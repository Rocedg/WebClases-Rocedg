<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">Trayectoria r(t) = (2t² − t; 3t + 1) entre 0 y 3 s</title>
<desc id="desc">Gráfica a escala del plano xy, en metros. La trayectoria empieza en (0; 1) m en t = 0, retrocede muy poco hacia x negativa, gira y avanza hacia la derecha y hacia arriba, curvándose, hasta (15; 10) m en t = 3 s.</desc>
