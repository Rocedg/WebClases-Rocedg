<title id="title">Salida horizontal a 4 m/s desde 5 m y desde 20 m</title>
<desc id="desc">Esquema sin escala en dos paneles dibujados con la misma escala. En los dos, la bola sale horizontalmente hacia +x a 4 m/s desde lo alto de una plataforma, con el origen O al pie. Prueba A: plataforma de 5 m. Prueba B: plataforma de 20 m. Cada bola describe media parábola hasta el suelo. La gravedad apunta hacia abajo.</desc>
