<title id="title">Tiro a 45° que pasa por (12; 3) m</title>
<desc id="desc">Esquema sin escala del plano vertical. Un lanzador en O, en el suelo, dispara a 45° sobre la horizontal con una rapidez v₀ desconocida. La trayectoria parabólica pasa por el punto (12; 3) m, marcado, y sigue hasta el suelo. La gravedad apunta hacia abajo.</desc>
