<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">Bola que se suelta en lo alto de una guía circular</title>
<desc id="desc">Esquema sin escala del plano vertical. Una guía circular de radio 1 m tiene su centro en (0; 5) m, sobre el eje y, por encima del suelo y = 0. Una bola recorre la guía en sentido horario a 4 m/s y se suelta en t = 0 en el punto más alto de la guía, que está marcado. No se dibuja el vuelo posterior.</desc>
