<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">Barca que cruza un río de 60 m</title>
<desc id="desc">Esquema sin escala en vista en planta. El río, de 60 m de ancho, ocupa la franja entre dos orillas paralelas al eje x; +x apunta aguas abajo y +y hacia la otra orilla. El agua fluye hacia +x a 2 m/s respecto a tierra. La barca sale del origen O, en una orilla, y apunta hacia la otra orilla (+y) a 3 m/s respecto al agua. No se dibuja su trayectoria respecto a tierra.</desc>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1f5fa8"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b8432f"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#16756a"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6d4fb0"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#55657a"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1f2d44"/></marker></defs>
<rect width="640" height="360" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2d44" stroke-linecap="round" stroke-linejoin="round">
<text x="191.5" y="289.4" text-anchor="end" font-weight="bold">O</text>
<path d="M101.1 271.4L532.9 271.4" fill="none" stroke="#55657a" stroke-width="1.6" marker-end="url(#ah-muted)"/>
<path d="M197.5 310.0L197.5 26.0" fill="none" stroke="#55657a" stroke-width="1.6" marker-end="url(#ah-muted)"/>
<text x="538.9" y="276.4" font-size="14">x (m)</text>
<text x="205.5" y="34.0" font-size="14">y (m)</text>
<rect x="101.1" y="78.6" width="417.9" height="192.9" fill="#e6f0fa"/>
<path d="M101.1 78.6L518.9 78.6" fill="none" stroke="#16756a" stroke-width="3"/>
<path d="M101.1 271.4L518.9 271.4" fill="none" stroke="#16756a" stroke-width="3"/>
<text x="514.9" y="70.6" text-anchor="end" fill="#16756a" font-size="13">orilla opuesta</text>
<path d="M310.0 175.0L366.0 175.0" fill="none" stroke="#1f5fa8" stroke-width="2.6" marker-end="url(#ah-blue)"/>
<path d="M406.4 175.0L462.4 175.0" fill="none" stroke="#1f5fa8" stroke-width="2.6" marker-end="url(#ah-blue)"/>
<text x="358.2" y="197.0" text-anchor="middle" fill="#1f5fa8" font-weight="bold" stroke="#ffffff" stroke-width="4" paint-order="stroke">agua: 2 m/s</text>
<path d="M197.5 271.4L197.5 191.4" fill="none" stroke="#b8432f" stroke-width="3" marker-end="url(#ah-red)"/>
<text x="205.5" y="205.4" fill="#b8432f" font-weight="bold" stroke="#ffffff" stroke-width="4" paint-order="stroke">barca respecto</text>
<text x="205.5" y="223.4" fill="#b8432f" font-weight="bold" stroke="#ffffff" stroke-width="4" paint-order="stroke">al agua: 3 m/s</text>
<path d="M126.8 271.4L126.8 78.6" fill="none" stroke="#1f2d44" stroke-width="1.4" marker-start="url(#ah-ink)" marker-end="url(#ah-ink)"/>
<text x="133.8" y="180.0" stroke="#ffffff" stroke-width="4" paint-order="stroke">60 m</text>
<text x="630.0" y="352.0" text-anchor="end" fill="#55657a" font-size="12" font-style="italic">Esquema sin escala</text>
</g>
</svg>
