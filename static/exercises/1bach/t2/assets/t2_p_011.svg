<title id="title">Dos pelotas con la misma componente vertical</title>
<desc id="desc">Esquema sin escala del plano vertical. Desde O, en el suelo, salen dos pelotas: A con velocidad inicial (6; 8) m/s y B con (12; 8) m/s. Las dos describen parábolas que vuelven al suelo; B llega más lejos. La gravedad apunta hacia abajo.</desc>
