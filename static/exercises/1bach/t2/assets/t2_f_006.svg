<title id="title">Proyectil lanzado desde el suelo</title>
<desc id="desc">Esquema sin escala del plano vertical. El proyectil sale de O, en el suelo, hacia arriba y a la derecha, describe una parábola y vuelve al suelo (y = 0) más a la derecha. La gravedad apunta hacia abajo. No se indican valores.</desc>
