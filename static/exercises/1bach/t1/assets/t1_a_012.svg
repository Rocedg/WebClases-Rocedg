<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">Elegir un modelo con condiciones iniciales</title><desc id="desc">Carrito en x = −3 m con velocidad 2 m/s y aceleración 4 m/s², ambas hacia +x; el sensor está en el origen.</desc>
<defs><marker id="a-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/></marker></defs>
<rect width="480" height="300" fill="#f8fafc"/>
<g font-family="Arial, sans-serif"><path d="M25.0 205.0 L465.0 205.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a-axis)"/><text x="465.0" y="193.0" font-size="17" text-anchor="end" fill="#64748b" font-weight="bold">+x</text><path d="M112.7 199.0 L112.7 211.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="112.7" y="231.0" font-size="17" text-anchor="middle" fill="#334155">−3</text><path d="M221.8 199.0 L221.8 211.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="221.8" y="231.0" font-size="17" text-anchor="middle" fill="#334155">0</text><path d="M221.8 196.0 L221.8 214.0" fill="none" stroke="#64748b" stroke-width="3"/><text x="465.0" y="251.0" font-size="15" text-anchor="end" fill="#64748b">x (m)</text><circle cx="221.8" cy="205.0" r="5.5" fill="#334155"/><text x="221.8" y="253.0" font-size="17" text-anchor="middle" fill="#334155">sensor</text><circle cx="112.7" cy="205.0" r="5.5" fill="#2563eb"/><text x="112.7" y="253.0" font-size="17" text-anchor="middle" fill="#334155">carrito</text><path d="M112.7 127.0 L192.7 127.0" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-blue)"/><text x="197.7" y="132.0" font-size="15" text-anchor="start" fill="#2563eb">v₀ = 2 m/s</text><path d="M112.7 157.0 L232.7 157.0" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#a-amber)"/><text x="237.7" y="162.0" font-size="15" text-anchor="start" fill="#d97706">a = 4 m/s²</text><text x="20.0" y="28.0" font-size="16" text-anchor="start" fill="#334155" font-weight="bold">Carrito de laboratorio en t = 0</text></g></svg>
