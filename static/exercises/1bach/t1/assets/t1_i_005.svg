<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">Ascensor con destino fijado por áreas</title><desc id="desc">Ascensor en la planta baja; tres tramos: a = 1,2 m/s² durante 3 s, velocidad constante 4 s y a = −0,9 m/s² hasta parar.</desc>
<defs><marker id="a-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/></marker></defs>
<rect width="480" height="300" fill="#f8fafc"/>
<g font-family="Arial, sans-serif"><path d="M60.0 272.0 L60.0 40.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a-axis)"/><text x="70.0" y="54.0" font-size="17" text-anchor="start" fill="#64748b" font-weight="bold">+y</text><rect x="140.0" y="40.0" width="110.0" height="222.0" rx="0" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><rect x="160.0" y="200.0" width="70.0" height="58.0" rx="4" fill="#2563eb" fill-opacity="0.85" stroke="none" stroke-width="2"/><text x="195.0" y="236.0" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold">ascensor</text><path d="M130.0 262.0 L260.0 262.0" fill="none" stroke="#475569" stroke-width="3"/><text x="68.0" y="280.0" font-size="15" text-anchor="start" fill="#334155">y = 0 (planta baja)</text><text x="270.0" y="110.0" font-size="15" text-anchor="start" fill="#2563eb">1.º: a = 1,2 m/s² · 3 s</text><text x="270.0" y="142.0" font-size="15" text-anchor="start" fill="#16a34a">2.º: v constante · 4 s</text><text x="270.0" y="174.0" font-size="15" text-anchor="start" fill="#d97706">3.º: a = −0,9 m/s² hasta parar</text><text x="270.0" y="24.0" font-size="16" text-anchor="start" fill="#334155" font-weight="bold">Ascensor que sale del reposo</text></g></svg>
