<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">Hasta detenerse, y no más allá</title><desc id="desc">Coche en x = 0 con velocidad 24 m/s hacia +x y aceleración de 6 m/s² en sentido contrario.</desc>
<defs><marker id="a-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/></marker></defs>
<rect width="480" height="300" fill="#f8fafc"/>
<g font-family="Arial, sans-serif"><path d="M25.0 200.0 L465.0 200.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a-axis)"/><text x="465.0" y="188.0" font-size="17" text-anchor="end" fill="#64748b" font-weight="bold">+x</text><path d="M66.7 194.0 L66.7 206.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="66.7" y="226.0" font-size="17" text-anchor="middle" fill="#334155">0</text><path d="M66.7 191.0 L66.7 209.0" fill="none" stroke="#64748b" stroke-width="3"/><text x="465.0" y="246.0" font-size="15" text-anchor="end" fill="#64748b">x (m)</text><circle cx="66.7" cy="200.0" r="5.5" fill="#334155"/><text x="66.7" y="248.0" font-size="17" text-anchor="middle" fill="#334155">empieza a frenar</text><path d="M66.7 122.0 L166.7 122.0" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-blue)"/><text x="171.7" y="127.0" font-size="15" text-anchor="start" fill="#2563eb">v₀ = 24 m/s</text><path d="M136.7 152.0 L66.7 152.0" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#a-amber)"/><text x="142.7" y="157.0" font-size="15" text-anchor="start" fill="#d97706">a = −6 m/s²</text><text x="20.0" y="28.0" font-size="16" text-anchor="start" fill="#334155" font-weight="bold">Carretera recta en t = 0</text></g></svg>
