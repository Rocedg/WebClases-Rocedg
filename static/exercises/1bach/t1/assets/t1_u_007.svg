<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">Programar una llegada</title><desc id="desc">Arriba, el pasillo con el almacén en x = 0 y la puerta en x = 840 m. Abajo, el eje de tiempo con t = 0 a las 10:00:00 y la llegada a las 10:05:00 (t = 300 s); la hora de salida es la incógnita.</desc>
<defs><marker id="a-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/></marker></defs>
<rect width="480" height="300" fill="#f8fafc"/>
<g font-family="Arial, sans-serif"><text x="20.0" y="28.0" font-size="16" text-anchor="start" fill="#334155" font-weight="bold">Espacio y reloj del reparto</text><path d="M25.0 105.0 L405.0 105.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a-axis)"/><text x="405.0" y="93.0" font-size="17" text-anchor="end" fill="#64748b" font-weight="bold">+x</text><path d="M40.0 99.0 L40.0 111.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="40.0" y="131.0" font-size="17" text-anchor="middle" fill="#334155">almacén</text><path d="M380.0 99.0 L380.0 111.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="380.0" y="131.0" font-size="17" text-anchor="middle" fill="#334155">puerta: 840</text><path d="M40.0 96.0 L40.0 114.0" fill="none" stroke="#64748b" stroke-width="3"/><text x="405.0" y="151.0" font-size="15" text-anchor="end" fill="#64748b">x (m)</text><path d="M40.0 70.0 L130.0 70.0" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-blue)"/><text x="136.0" y="75.0" font-size="15" text-anchor="start" fill="#2563eb">1,75 m/s</text><path d="M25.0 225.0 L465.0 225.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a-axis)"/><path d="M208.4 219.0 L208.4 231.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="208.4" y="251.0" font-size="17" text-anchor="middle" fill="#334155">t = 0</text><path d="M418.9 219.0 L418.9 231.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="418.9" y="251.0" font-size="17" text-anchor="middle" fill="#334155">t = 300</text><text x="465.0" y="271.0" font-size="15" text-anchor="end" fill="#64748b">t (s)</text><text x="208.4" y="205.0" font-size="15" text-anchor="middle" fill="#2563eb">10:00:00</text><text x="418.9" y="205.0" font-size="15" text-anchor="middle" fill="#2563eb">10:05:00</text><text x="89.1" y="205.0" font-size="15" text-anchor="middle" fill="#d97706">salida = ?</text><circle cx="418.9" cy="225.0" r="5" fill="#2563eb"/></g></svg>
