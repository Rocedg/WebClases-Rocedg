<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">El coche patrulla que arranca</title><desc id="desc">En t = 0 el coche pasa a 25 m/s junto al coche patrulla parado en x = 0, que arranca en ese instante con 2,5 m/s².</desc>
<defs><marker id="a-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker></defs>
<rect width="480" height="300" fill="#f8fafc"/>
<g font-family="Arial, sans-serif"><path d="M40.0 200.0 L450.0 200.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a-axis)"/><text x="440.0" y="225.0" font-size="17" text-anchor="end" fill="#64748b" font-weight="bold">+x</text><path d="M80.0 192.0 L80.0 208.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="80.0" y="228.0" font-size="14" text-anchor="middle" fill="#334155">x = 0</text><rect x="60" y="150" width="44" height="22" rx="5" fill="#1e3a8a"/><text x="82.0" y="140.0" font-size="14" text-anchor="middle" fill="#1e3a8a">patrulla (reposo)</text><path d="M110.0 165.0 L190.0 165.0" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#a-amber)"/><text x="150.0" y="186.0" font-size="14" text-anchor="middle" fill="#d97706">a = 2,5 m/s²</text><rect x="60" y="92" width="44" height="22" rx="5" fill="#2563eb"/><text x="82.0" y="84.0" font-size="14" text-anchor="middle" fill="#2563eb">coche</text><path d="M110.0 103.0 L230.0 103.0" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-blue)"/><text x="240.0" y="108.0" font-size="14" text-anchor="start" fill="#2563eb">v = 25 m/s constante</text><text x="110.0" y="24.0" font-size="16" text-anchor="start" fill="#334155" font-weight="bold">En t = 0 los dos están en x = 0</text></g></svg>
