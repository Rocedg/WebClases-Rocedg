<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">Ciclistas con unidades distintas</title><desc id="desc">Ciclista A en el origen hacia el este a 18 km/h y ciclista B a 1,2 km hacia el oeste a 12 km/h.</desc>
<defs><marker id="a-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/></marker></defs>
<rect width="480" height="300" fill="#f8fafc"/>
<g font-family="Arial, sans-serif"><path d="M25.0 190.0 L420.0 190.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a-axis)"/><text x="420.0" y="178.0" font-size="17" text-anchor="end" fill="#64748b" font-weight="bold">+x</text><path d="M60.9 184.0 L60.9 196.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="60.9" y="216.0" font-size="17" text-anchor="middle" fill="#334155">0</text><path d="M374.1 184.0 L374.1 196.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="374.1" y="216.0" font-size="17" text-anchor="middle" fill="#334155">1200</text><path d="M60.9 181.0 L60.9 199.0" fill="none" stroke="#64748b" stroke-width="3"/><text x="420.0" y="236.0" font-size="15" text-anchor="end" fill="#64748b">x (m)</text><circle cx="60.9" cy="190.0" r="5.5" fill="#2563eb"/><text x="60.9" y="238.0" font-size="17" text-anchor="middle" fill="#334155">A</text><circle cx="374.1" cy="190.0" r="5.5" fill="#2563eb"/><text x="374.1" y="238.0" font-size="17" text-anchor="middle" fill="#334155">B</text><path d="M60.9 142.0 L145.9 142.0" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-blue)"/><text x="150.9" y="147.0" font-size="15" text-anchor="start" fill="#2563eb">18 km/h</text><path d="M374.1 142.0 L309.1 142.0" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a-green)"/><text x="304.1" y="147.0" font-size="15" text-anchor="end" fill="#16a34a">12 km/h</text><path d="M60.9 85.0 L374.1 85.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a-axis)"/><path d="M374.1 85.0 L60.9 85.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a-axis)"/><text x="217.5" y="77.0" font-size="15" text-anchor="middle" fill="#64748b">1,2 km</text><text x="20.0" y="28.0" font-size="16" text-anchor="start" fill="#334155" font-weight="bold">Carretera recta en t = 0 (+x hacia el este)</text></g></svg>
