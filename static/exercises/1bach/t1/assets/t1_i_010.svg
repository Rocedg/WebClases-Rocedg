<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">Simulacro: un reparto de ida y vuelta</title><desc id="desc">Esquema del reparto: ida acelerando 1 m/s² durante 4 s y después a velocidad constante 6 s, espera de 5 s y vuelta a 2 m/s.</desc>
<defs><marker id="a-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/></marker></defs>
<rect width="480" height="300" fill="#f8fafc"/>
<g font-family="Arial, sans-serif"><text x="20.0" y="28.0" font-size="16" text-anchor="start" fill="#334155" font-weight="bold">Pasillo recto: ida, espera y vuelta</text><path d="M25.0 230.0 L465.0 230.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a-axis)"/><text x="465.0" y="218.0" font-size="17" text-anchor="end" fill="#64748b" font-weight="bold">+x</text><path d="M67.9 224.0 L67.9 236.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="67.9" y="256.0" font-size="17" text-anchor="middle" fill="#334155">almacén</text><path d="M67.9 221.0 L67.9 239.0" fill="none" stroke="#64748b" stroke-width="3"/><text x="465.0" y="276.0" font-size="15" text-anchor="end" fill="#64748b">x (m)</text><text x="347.0" y="256.0" font-size="15" text-anchor="middle" fill="#334155">entrega</text><path d="M347.0 222.0 L347.0 238.0" fill="none" stroke="#64748b" stroke-width="3"/><path d="M67.9 175.0 L347.0 175.0" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-blue)"/><text x="67.9" y="160.0" font-size="15" text-anchor="start" fill="#2563eb">ida: 1 m/s² · 4 s, luego v constante · 6 s</text><text x="347.0" y="108.0" font-size="15" text-anchor="middle" fill="#64748b">espera 5 s</text><path d="M347.0 80.0 L67.9 80.0" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#a-amber)"/><text x="67.9" y="65.0" font-size="15" text-anchor="start" fill="#d97706">vuelta: 2 m/s hasta el almacén</text></g></svg>
