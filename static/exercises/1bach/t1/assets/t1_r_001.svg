<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">La estación como origen</title><desc id="desc">Vía recta con la estación O en el origen, el apeadero A 300 m al oeste y B 500 m al este; el vagón va de B a A.</desc>
<defs><marker id="a-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/></marker></defs>
<rect width="480" height="300" fill="#f8fafc"/>
<g font-family="Arial, sans-serif"><path d="M25.0 165.0 L465.0 165.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a-axis)"/><text x="465.0" y="153.0" font-size="17" text-anchor="end" fill="#64748b" font-weight="bold">+x</text><path d="M200.0 156.0 L200.0 174.0" fill="none" stroke="#64748b" stroke-width="3"/><text x="465.0" y="211.0" font-size="15" text-anchor="end" fill="#64748b">x (m)</text><circle cx="80.0" cy="165.0" r="5.5" fill="#2563eb"/><text x="80.0" y="149.0" font-size="17" text-anchor="middle" fill="#334155">A</text><circle cx="200.0" cy="165.0" r="5.5" fill="#334155"/><text x="200.0" y="149.0" font-size="17" text-anchor="middle" fill="#334155">O (estación)</text><circle cx="400.0" cy="165.0" r="5.5" fill="#2563eb"/><text x="400.0" y="149.0" font-size="17" text-anchor="middle" fill="#334155">B</text><path d="M80.0 205.0 L200.0 205.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a-axis)"/><path d="M200.0 205.0 L80.0 205.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a-axis)"/><text x="140.0" y="223.0" font-size="15" text-anchor="middle" fill="#64748b">300 m</text><path d="M200.0 205.0 L400.0 205.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a-axis)"/><path d="M400.0 205.0 L200.0 205.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a-axis)"/><text x="300.0" y="223.0" font-size="15" text-anchor="middle" fill="#64748b">500 m</text><text x="40.0" y="70.0" font-size="17" text-anchor="start" fill="#64748b">oeste</text><text x="465.0" y="70.0" font-size="17" text-anchor="end" fill="#64748b">este</text><path d="M400.0 85.0 L80.0 85.0" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#a-amber)"/><text x="240.0" y="76.0" font-size="15" text-anchor="middle" fill="#d97706">vagón: de B a A</text><text x="20.0" y="28.0" font-size="16" text-anchor="start" fill="#334155" font-weight="bold">Vía recta oeste–este</text></g></svg>
