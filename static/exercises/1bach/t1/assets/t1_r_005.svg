<title id="title">Trasladar e invertir un eje</title><desc id="desc">Dos ejes paralelos: el de Ana con origen en el portal y +x al este; el de Benito con origen en la farola (x = 30 m de Ana) y +x′ al oeste. El coche está en x = 10 m en t = 0.</desc>
