<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">MRUA que empieza hacia atrás</title><desc id="desc">Carrito en x = 5 m con velocidad inicial 4 m/s hacia la izquierda y aceleración 2 m/s² hacia la derecha.</desc>
