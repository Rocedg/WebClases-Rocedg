<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">Tres representaciones compatibles</title><desc id="desc">Tabla con los tríos A, B y C de funciones x(t), v(t) y a(t) propuestos; datos x₀ = 1 m y v₀ = 2 m/s.</desc>
<defs><marker id="a-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/></marker></defs>
<rect width="480" height="300" fill="#f8fafc"/>
<g font-family="Arial, sans-serif"><text x="20.0" y="28.0" font-size="16" text-anchor="start" fill="#334155" font-weight="bold">Tres propuestas para 0 ≤ t ≤ 3 s (SI)</text><rect x="40.0" y="60.0" width="415.0" height="176.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/><rect x="40.0" y="60.0" width="40.0" height="44.0" rx="0" fill="#eef2f7" stroke="none" stroke-width="2"/><text x="60.0" y="83.0" font-size="17" text-anchor="middle" fill="#334155" font-weight="bold"></text><text x="142.5" y="83.0" font-size="17" text-anchor="middle" fill="#334155">x(t)</text><text x="267.5" y="83.0" font-size="17" text-anchor="middle" fill="#334155">v(t)</text><text x="392.5" y="83.0" font-size="17" text-anchor="middle" fill="#334155">a(t)</text><path d="M40.0 104.0 L455.0 104.0" fill="none" stroke="#e2e8f0" stroke-width="1.5"/><rect x="40.0" y="104.0" width="40.0" height="44.0" rx="0" fill="#eef2f7" stroke="none" stroke-width="2"/><text x="60.0" y="127.0" font-size="17" text-anchor="middle" fill="#334155" font-weight="bold">A</text><text x="142.5" y="127.0" font-size="17" text-anchor="middle" fill="#334155">1 + 2t + t²</text><text x="267.5" y="127.0" font-size="17" text-anchor="middle" fill="#334155">2 + 2t</text><text x="392.5" y="127.0" font-size="17" text-anchor="middle" fill="#334155">2</text><path d="M40.0 148.0 L455.0 148.0" fill="none" stroke="#e2e8f0" stroke-width="1.5"/><rect x="40.0" y="148.0" width="40.0" height="44.0" rx="0" fill="#eef2f7" stroke="none" stroke-width="2"/><text x="60.0" y="171.0" font-size="17" text-anchor="middle" fill="#334155" font-weight="bold">B</text><text x="142.5" y="171.0" font-size="17" text-anchor="middle" fill="#334155">1 + 2t + t²</text><text x="267.5" y="171.0" font-size="17" text-anchor="middle" fill="#334155">2 + t</text><text x="392.5" y="171.0" font-size="17" text-anchor="middle" fill="#334155">1</text><path d="M40.0 192.0 L455.0 192.0" fill="none" stroke="#e2e8f0" stroke-width="1.5"/><rect x="40.0" y="192.0" width="40.0" height="44.0" rx="0" fill="#eef2f7" stroke="none" stroke-width="2"/><text x="60.0" y="215.0" font-size="17" text-anchor="middle" fill="#334155" font-weight="bold">C</text><text x="142.5" y="215.0" font-size="17" text-anchor="middle" fill="#334155">1 + 2t</text><text x="267.5" y="215.0" font-size="17" text-anchor="middle" fill="#334155">2 + 2t</text><text x="392.5" y="215.0" font-size="17" text-anchor="middle" fill="#334155">2</text><path d="M80.0 60.0 L80.0 236.0" fill="none" stroke="#e2e8f0" stroke-width="1.5"/><path d="M205.0 60.0 L205.0 236.0" fill="none" stroke="#e2e8f0" stroke-width="1.5"/><path d="M330.0 60.0 L330.0 236.0" fill="none" stroke="#e2e8f0" stroke-width="1.5"/><text x="40.0" y="262.0" font-size="16" text-anchor="start" fill="#2563eb">Datos: x₀ = 1 m, v₀ = 2 m/s</text></g></svg>
