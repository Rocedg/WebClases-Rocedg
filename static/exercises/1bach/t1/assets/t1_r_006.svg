<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">Tres signos, tres informaciones</title><desc id="desc">A en x = −5 m con velocidad +3 m/s y aceleración hacia −x; B en x = 4 m con velocidad −2 m/s y aceleración hacia −x.</desc>
<defs><marker id="a-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/></marker></defs>
<rect width="480" height="300" fill="#f8fafc"/>
<g font-family="Arial, sans-serif"><path d="M25.0 215.0 L465.0 215.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a-axis)"/><text x="465.0" y="203.0" font-size="17" text-anchor="end" fill="#64748b" font-weight="bold">+x</text><path d="M115.0 209.0 L115.0 221.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="115.0" y="241.0" font-size="17" text-anchor="middle" fill="#334155">−5</text><path d="M240.0 209.0 L240.0 221.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="240.0" y="241.0" font-size="17" text-anchor="middle" fill="#334155">0</text><path d="M340.0 209.0 L340.0 221.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="340.0" y="241.0" font-size="17" text-anchor="middle" fill="#334155">4</text><path d="M240.0 206.0 L240.0 224.0" fill="none" stroke="#64748b" stroke-width="3"/><text x="465.0" y="261.0" font-size="15" text-anchor="end" fill="#64748b">x (m)</text><circle cx="115.0" cy="215.0" r="5.5" fill="#2563eb"/><text x="115.0" y="263.0" font-size="17" text-anchor="middle" fill="#334155">A</text><circle cx="340.0" cy="215.0" r="5.5" fill="#2563eb"/><text x="340.0" y="263.0" font-size="17" text-anchor="middle" fill="#334155">B</text><path d="M115.0 107.0 L205.0 107.0" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-blue)"/><text x="210.0" y="112.0" font-size="15" text-anchor="start" fill="#2563eb">v = +3 m/s</text><path d="M115.0 167.0 L70.0 167.0" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#a-amber)"/><text x="65.0" y="172.0" font-size="15" text-anchor="end" fill="#d97706">a</text><path d="M340.0 137.0 L270.0 137.0" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-blue)"/><text x="345.0" y="142.0" font-size="15" text-anchor="start" fill="#2563eb">v = −2 m/s</text><path d="M340.0 167.0 L295.0 167.0" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#a-amber)"/><text x="345.0" y="172.0" font-size="15" text-anchor="start" fill="#d97706">a</text><text x="20.0" y="28.0" font-size="16" text-anchor="start" fill="#334155" font-weight="bold">Pista en t = 0: v en azul, a en naranja</text></g></svg>
