<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">¿Detención o impacto antes de parar?</title><desc id="desc">El coche pasa por x = 0 a 20 m/s cuando ve un obstáculo fijo en x = 50 m; reacciona 0,5 s y luego frena con −4 m/s².</desc>
