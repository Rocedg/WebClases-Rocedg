<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">Paso por una baliza</title><desc id="desc">Recta con el quiosco en el origen, la patinadora en x = −24 m con velocidad 6 m/s hacia +x y una baliza en x = 90 m.</desc>
