<rect width="480" height="300" fill="#f8fafc"/>
<g font-family="Arial, sans-serif"><path d="M25.0 190.0 L465.0 190.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a-axis)"/><text x="465.0" y="178.0" font-size="17" text-anchor="end" fill="#64748b" font-weight="bold">+x</text><path d="M85.7 184.0 L85.7 196.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="85.7" y="216.0" font-size="17" text-anchor="middle" fill="#334155">−24</text><path d="M154.3 184.0 L154.3 196.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="154.3" y="216.0" font-size="17" text-anchor="middle" fill="#334155">0</text><path d="M411.4 184.0 L411.4 196.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="411.4" y="216.0" font-size="17" text-anchor="middle" fill="#334155">90</text><path d="M154.3 181.0 L154.3 199.0" fill="none" stroke="#64748b" stroke-width="3"/><text x="465.0" y="236.0" font-size="15" text-anchor="end" fill="#64748b">x (m)</text><circle cx="85.7" cy="190.0" r="5.5" fill="#2563eb"/><text x="85.7" y="238.0" font-size="17" text-anchor="middle" fill="#334155">patinadora</text><circle cx="154.3" cy="190.0" r="5.5" fill="#334155"/><text x="154.3" y="260.0" font-size="17" text-anchor="middle" fill="#334155">quiosco</text><rect x="407.4" y="150.0" width="8.0" height="40.0" rx="0" fill="#dc2626" stroke="none" stroke-width="2"/><text x="411.4" y="140.0" font-size="17" text-anchor="middle" fill="#dc2626">baliza</text><path d="M85.7 142.0 L165.7 142.0" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-blue)"/><text x="170.7" y="147.0" font-size="15" text-anchor="start" fill="#2563eb">v = 6 m/s</text><text x="20.0" y="28.0" font-size="16" text-anchor="start" fill="#334155" font-weight="bold">Paseo marítimo recto (+x hacia el este)</text></g></svg>
