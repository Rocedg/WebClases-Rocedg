<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">¿Alcanza el autobús?</title><desc id="desc">En t = 0 la pasajera corre a 6 m/s desde x = 0 y el autobús arranca del reposo en x = 20 m con 1 m/s².</desc>
<defs><marker id="a-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker></defs>
<rect width="480" height="300" fill="#f8fafc"/>
<g font-family="Arial, sans-serif"><path d="M40.0 200.0 L450.0 200.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a-axis)"/><text x="440.0" y="225.0" font-size="17" text-anchor="end" fill="#64748b" font-weight="bold">+x</text><path d="M80.0 192.0 L80.0 208.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="80.0" y="228.0" font-size="14" text-anchor="middle" fill="#334155">x = 0</text><path d="M280.0 192.0 L280.0 208.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="280.0" y="228.0" font-size="14" text-anchor="middle" fill="#334155">x = 20 m</text><circle cx="80.0" cy="170.0" r="9" fill="#16a34a"/><text x="80.0" y="150.0" font-size="14" text-anchor="middle" fill="#16a34a">pasajera</text><path d="M95.0 170.0 L170.0 170.0" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a-green)"/><text x="132.0" y="190.0" font-size="14" text-anchor="middle" fill="#16a34a">6 m/s</text><rect x="280" y="140" width="130" height="44" rx="6" fill="#2563eb"/><text x="345.0" y="168.0" font-size="15" text-anchor="middle" fill="#ffffff">autobús</text><path d="M280.0 140.0 L280.0 184.0" fill="none" stroke="#ffffff" stroke-width="3"/><text x="280.0" y="130.0" font-size="13" text-anchor="middle" fill="#334155">puerta</text><path d="M330.0 110.0 L410.0 110.0" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#a-amber)"/><text x="370.0" y="100.0" font-size="14" text-anchor="middle" fill="#d97706">reposo, a = 1 m/s²</text><text x="110.0" y="24.0" font-size="16" text-anchor="start" fill="#334155" font-weight="bold">Situación en t = 0</text></g></svg>
