<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">Un mensajero alcanza al peatón</title><desc id="desc">En t = 0 el peatón pasa por el portal (x = 0) a 1,5 m/s; la ciclista está parada en x = −90 m y sale en t = 20 s a 7,5 m/s.</desc>
<defs><marker id="a-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/></marker></defs>
<rect width="480" height="300" fill="#f8fafc"/>
<g font-family="Arial, sans-serif"><path d="M25.0 200.0 L465.0 200.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a-axis)"/><text x="465.0" y="188.0" font-size="17" text-anchor="end" fill="#64748b" font-weight="bold">+x</text><path d="M93.3 194.0 L93.3 206.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="93.3" y="226.0" font-size="17" text-anchor="middle" fill="#334155">−90</text><path d="M333.3 194.0 L333.3 206.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="333.3" y="226.0" font-size="17" text-anchor="middle" fill="#334155">0</text><path d="M333.3 191.0 L333.3 209.0" fill="none" stroke="#64748b" stroke-width="3"/><text x="465.0" y="246.0" font-size="15" text-anchor="end" fill="#64748b">x (m)</text><circle cx="93.3" cy="200.0" r="5.5" fill="#16a34a"/><text x="93.3" y="248.0" font-size="17" text-anchor="middle" fill="#16a34a">ciclista</text><circle cx="333.3" cy="200.0" r="5.5" fill="#2563eb"/><text x="333.3" y="248.0" font-size="17" text-anchor="middle" fill="#334155">peatón (portal)</text><path d="M333.3 152.0 L388.3 152.0" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-blue)"/><text x="393.3" y="157.0" font-size="15" text-anchor="start" fill="#2563eb">1,5 m/s</text><path d="M93.3 122.0 L183.3 122.0" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a-green)"/><text x="188.3" y="127.0" font-size="15" text-anchor="start" fill="#16a34a">7,5 m/s desde t = 20 s</text><text x="20.0" y="28.0" font-size="16" text-anchor="start" fill="#334155" font-weight="bold">Acera recta en t = 0</text></g></svg>
