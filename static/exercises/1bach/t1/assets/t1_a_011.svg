<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">Leer los coeficientes con sus unidades</title><desc id="desc">Bloque sobre una guía recta con el origen en el extremo izquierdo; su ecuación de la posición es x(t) = 7 − 6t + 1,5t² en SI.</desc>
<defs><marker id="a-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/></marker></defs>
<rect width="480" height="300" fill="#f8fafc"/>
<g font-family="Arial, sans-serif"><text x="20.0" y="28.0" font-size="16" text-anchor="start" fill="#334155" font-weight="bold">Guía recta</text><rect x="40.0" y="175.0" width="400.0" height="12.0" rx="3" fill="#cbd5e1" stroke="none" stroke-width="2"/><rect x="40.0" y="150.0" width="10.0" height="37.0" rx="0" fill="#475569" stroke="none" stroke-width="2"/><rect x="250.0" y="147.0" width="48.0" height="28.0" rx="4" fill="#2563eb" stroke="none" stroke-width="2"/><text x="274.0" y="136.0" font-size="15" text-anchor="middle" fill="#334155">bloque</text><path d="M30.0 235.0 L445.0 235.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a-axis)"/><text x="445.0" y="223.0" font-size="17" text-anchor="end" fill="#64748b" font-weight="bold">+x</text><path d="M45.0 229.0 L45.0 241.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="45.0" y="261.0" font-size="17" text-anchor="middle" fill="#334155">0</text><path d="M45.0 226.0 L45.0 244.0" fill="none" stroke="#64748b" stroke-width="3"/><text x="445.0" y="281.0" font-size="15" text-anchor="end" fill="#64748b">x (m)</text><text x="240.0" y="100.0" font-size="18" text-anchor="middle" fill="#2563eb">x(t) = 7 − 6t + 1,5t²</text></g></svg>
