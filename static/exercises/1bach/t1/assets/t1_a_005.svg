<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">Desplazamiento tras dar la vuelta</title><desc id="desc">Móvil en x = −2 m con velocidad 8 m/s hacia +x y aceleración 2 m/s² hacia −x.</desc>
<defs><marker id="a-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/></marker></defs>
<rect width="480" height="300" fill="#f8fafc"/>
<g font-family="Arial, sans-serif"><path d="M25.0 200.0 L465.0 200.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a-axis)"/><text x="465.0" y="188.0" font-size="17" text-anchor="end" fill="#64748b" font-weight="bold">+x</text><path d="M76.4 194.0 L76.4 206.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="76.4" y="226.0" font-size="17" text-anchor="middle" fill="#334155">−2</text><path d="M112.7 194.0 L112.7 206.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="112.7" y="226.0" font-size="17" text-anchor="middle" fill="#334155">0</text><path d="M112.7 191.0 L112.7 209.0" fill="none" stroke="#64748b" stroke-width="3"/><text x="465.0" y="246.0" font-size="15" text-anchor="end" fill="#64748b">x (m)</text><circle cx="76.4" cy="200.0" r="5.5" fill="#2563eb"/><text x="76.4" y="248.0" font-size="17" text-anchor="middle" fill="#334155">salida</text><path d="M76.4 122.0 L166.4 122.0" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-blue)"/><text x="171.4" y="127.0" font-size="15" text-anchor="start" fill="#2563eb">v₀ = 8 m/s</text><path d="M136.4 152.0 L76.4 152.0" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#a-amber)"/><text x="142.4" y="157.0" font-size="15" text-anchor="start" fill="#d97706">a = −2 m/s²</text><text x="20.0" y="28.0" font-size="16" text-anchor="start" fill="#334155" font-weight="bold">Eje +x hacia el este, t = 0</text></g></svg>
