<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">Una altura que se alcanza dos veces y otra que nunca</title><desc id="desc">La pelota sale de la mano (y = 0) hacia arriba a 12 m/s; marcas a 5 m y a 9 m sobre la mano; aceleración −9,81 m/s².</desc>
<defs><marker id="a-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker></defs>
<rect width="480" height="300" fill="#f8fafc"/>
<g font-family="Arial, sans-serif"><path d="M60.0 270.0 L60.0 40.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a-axis)"/><text x="70.0" y="52.0" font-size="17" text-anchor="start" fill="#64748b" font-weight="bold">+y</text><path d="M50.0 240.0 L330.0 240.0" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/><text x="340.0" y="245.0" font-size="15" text-anchor="start" fill="#334155">y = 0 (mano)</text><path d="M50.0 145.0 L330.0 145.0" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 5"/><text x="340.0" y="150.0" font-size="15" text-anchor="start" fill="#16a34a">y = 5 m</text><path d="M50.0 100.5 L330.0 100.5" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 4"/><text x="340.0" y="105.5" font-size="14" text-anchor="start" fill="#64748b">altura máxima = ?</text><path d="M50.0 69.0 L330.0 69.0" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 5"/><text x="340.0" y="74.0" font-size="15" text-anchor="start" fill="#dc2626">y = 9 m: ¿llega?</text><circle cx="160.0" cy="240.0" r="8" fill="#2563eb"/><path d="M160.0 226.0 L160.0 164.0" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-blue)"/><text x="170.0" y="202.0" font-size="15" text-anchor="start" fill="#2563eb">v₀ = 12 m/s</text><path d="M270.0 171.6 L270.0 217.2" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#a-amber)"/><text x="280.0" y="198.2" font-size="14" text-anchor="start" fill="#d97706">a = −9,81 m/s²</text><text x="110.0" y="24.0" font-size="16" text-anchor="start" fill="#334155" font-weight="bold">Lanzamiento vertical desde la mano</text></g></svg>
