<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">Reacción y frenada son dos modelos</title><desc id="desc">El coche va a 18 m/s cuando ve el obstáculo (x = 0, t = 0); reacciona durante 0,75 s y luego frena con −4,5 m/s².</desc>
<defs><marker id="a-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/></marker></defs>
<rect width="480" height="300" fill="#f8fafc"/>
<g font-family="Arial, sans-serif"><path d="M25.0 205.0 L465.0 205.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a-axis)"/><text x="465.0" y="193.0" font-size="17" text-anchor="end" fill="#64748b" font-weight="bold">+x</text><path d="M59.0 199.0 L59.0 211.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="59.0" y="231.0" font-size="17" text-anchor="middle" fill="#334155">0</text><path d="M59.0 196.0 L59.0 214.0" fill="none" stroke="#64748b" stroke-width="3"/><text x="465.0" y="251.0" font-size="15" text-anchor="end" fill="#64748b">x (m)</text><circle cx="59.0" cy="205.0" r="5.5" fill="#334155"/><text x="59.0" y="253.0" font-size="17" text-anchor="middle" fill="#334155">ve el obstáculo</text><path d="M59.0 127.0 L149.0 127.0" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-blue)"/><text x="154.0" y="132.0" font-size="15" text-anchor="start" fill="#2563eb">18 m/s</text><text x="59.0" y="98.0" font-size="15" text-anchor="start" fill="#64748b">1.º reacción: 0,75 s a velocidad constante</text><text x="59.0" y="74.0" font-size="15" text-anchor="start" fill="#d97706">2.º frenada: a = −4,5 m/s² hasta parar</text><text x="20.0" y="28.0" font-size="16" text-anchor="start" fill="#334155" font-weight="bold">Dos tramos: reacción y frenada</text></g></svg>
