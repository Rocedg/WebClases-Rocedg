<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">Paseo, parada y regreso</title><desc id="desc">Esquema de tres tramos: ida a 2 m/s durante 30 s, parada de 20 s y vuelta a casa a 1,5 m/s.</desc>
<defs><marker id="a-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/></marker></defs>
<rect width="480" height="300" fill="#f8fafc"/>
<g font-family="Arial, sans-serif"><path d="M25.0 200.0 L465.0 200.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a-axis)"/><text x="465.0" y="188.0" font-size="17" text-anchor="end" fill="#64748b" font-weight="bold">+x</text><path d="M72.7 194.0 L72.7 206.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="72.7" y="226.0" font-size="17" text-anchor="middle" fill="#334155">casa</text><path d="M72.7 191.0 L72.7 209.0" fill="none" stroke="#64748b" stroke-width="3"/><text x="465.0" y="246.0" font-size="15" text-anchor="end" fill="#64748b">x (m)</text><text x="465.0" y="225.0" font-size="15" text-anchor="end" fill="#64748b">hacia la biblioteca</text><path d="M72.7 90.0 L317.6 90.0" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-blue)"/><text x="72.7" y="81.0" font-size="15" text-anchor="start" fill="#2563eb">1.º: 2 m/s durante 30 s</text><text x="325.6" y="112.0" font-size="15" text-anchor="start" fill="#64748b">2.º: parado 20 s</text><path d="M317.6 150.0 L72.7 150.0" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#a-amber)"/><text x="72.7" y="141.0" font-size="15" text-anchor="start" fill="#d97706">3.º: 1,5 m/s hasta casa</text><text x="20.0" y="28.0" font-size="16" text-anchor="start" fill="#334155" font-weight="bold">Calle recta: ida, parada y vuelta</text></g></svg>
