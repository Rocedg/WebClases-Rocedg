<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">Lanzar hacia abajo desde un puente</title><desc id="desc">Puente a 20 m sobre el agua; la piedra sale hacia abajo a 5 m/s; +y hacia arriba con origen en el agua y aceleración −9,81 m/s².</desc>
<defs><marker id="a-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker></defs>
<rect width="480" height="300" fill="#f8fafc"/>
<g font-family="Arial, sans-serif"><path d="M60.0 270.0 L60.0 40.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a-axis)"/><text x="70.0" y="52.0" font-size="17" text-anchor="start" fill="#64748b" font-weight="bold">+y</text><rect x="80" y="230" width="380" height="45" fill="#bfdbfe"/><text x="300.0" y="258.0" font-size="15" text-anchor="start" fill="#334155">agua: y = 0</text><rect x="80" y="70" width="200" height="14" fill="#94a3b8"/><text x="90.0" y="62.0" font-size="14" text-anchor="start" fill="#334155">puente</text><path d="M300.0 77.0 L300.0 230.0" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/><text x="310.0" y="160.0" font-size="15" text-anchor="start" fill="#334155">20 m</text><circle cx="230.0" cy="98.0" r="8" fill="#2563eb"/><path d="M230.0 110.0 L230.0 170.0" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-blue)"/><text x="150.0" y="150.0" font-size="15" text-anchor="end" fill="#2563eb">v₀ = 5 m/s</text><text x="150.0" y="170.0" font-size="14" text-anchor="end" fill="#2563eb">hacia abajo</text><path d="M400.0 110.0 L400.0 170.0" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#a-amber)"/><text x="390.0" y="100.0" font-size="15" text-anchor="middle" fill="#d97706">a = −9,81 m/s²</text><text x="110.0" y="24.0" font-size="16" text-anchor="start" fill="#334155" font-weight="bold">Piedra lanzada hacia abajo</text></g></svg>
