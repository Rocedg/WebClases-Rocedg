<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">Los segundos no aportan igual distancia</title><desc id="desc">Tabla con t = 0, 2 y 4 s y posiciones 0, ? y ?; el robot arranca del reposo con a = 1,6 m/s².</desc>
<defs><marker id="a-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/></marker></defs>
<rect width="480" height="300" fill="#f8fafc"/>
<g font-family="Arial, sans-serif"><text x="20.0" y="28.0" font-size="16" text-anchor="start" fill="#334155" font-weight="bold">Robot que arranca del reposo, a = 1,6 m/s²</text><rect x="70.0" y="80.0" width="350.0" height="88.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/><rect x="70.0" y="80.0" width="80.0" height="44.0" rx="0" fill="#eef2f7" stroke="none" stroke-width="2"/><text x="110.0" y="103.0" font-size="17" text-anchor="middle" fill="#334155" font-weight="bold">t (s)</text><text x="195.0" y="103.0" font-size="17" text-anchor="middle" fill="#334155">0</text><text x="285.0" y="103.0" font-size="17" text-anchor="middle" fill="#334155">2</text><text x="375.0" y="103.0" font-size="17" text-anchor="middle" fill="#334155">4</text><path d="M70.0 124.0 L420.0 124.0" fill="none" stroke="#e2e8f0" stroke-width="1.5"/><rect x="70.0" y="124.0" width="80.0" height="44.0" rx="0" fill="#eef2f7" stroke="none" stroke-width="2"/><text x="110.0" y="147.0" font-size="17" text-anchor="middle" fill="#334155" font-weight="bold">x (m)</text><text x="195.0" y="147.0" font-size="17" text-anchor="middle" fill="#334155">0</text><text x="285.0" y="147.0" font-size="17" text-anchor="middle" fill="#2563eb" font-weight="bold">?</text><text x="375.0" y="147.0" font-size="17" text-anchor="middle" fill="#2563eb" font-weight="bold">?</text><path d="M150.0 80.0 L150.0 168.0" fill="none" stroke="#e2e8f0" stroke-width="1.5"/><path d="M240.0 80.0 L240.0 168.0" fill="none" stroke="#e2e8f0" stroke-width="1.5"/><path d="M330.0 80.0 L330.0 168.0" fill="none" stroke="#e2e8f0" stroke-width="1.5"/><text x="70.0" y="210.0" font-size="16" text-anchor="start" fill="#334155">Origen donde arranca; +x hacia delante.</text><text x="70.0" y="238.0" font-size="16" text-anchor="start" fill="#2563eb">x(t) = ½·a·t²</text></g></svg>
