<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">Subir y regresar al nivel de salida</title><desc id="desc">La bola sale de la mano (y = 0) hacia arriba a 16 m/s con aceleración −10 m/s²; la altura máxima es la incógnita.</desc>
<defs><marker id="a-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/></marker></defs>
<rect width="480" height="300" fill="#f8fafc"/>
<g font-family="Arial, sans-serif"><path d="M60.0 260.0 L60.0 50.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a-axis)"/><text x="70.0" y="64.0" font-size="17" text-anchor="start" fill="#64748b" font-weight="bold">+y</text><path d="M50.0 220.0 L300.0 220.0" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/><text x="310.0" y="225.0" font-size="15" text-anchor="start" fill="#334155">y = 0 (mano)</text><circle cx="200.0" cy="220.0" r="9" fill="#2563eb"/><path d="M200.0 205.0 L200.0 120.0" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-blue)"/><text x="210.0" y="150.0" font-size="15" text-anchor="start" fill="#2563eb">v₀ = 16 m/s</text><path d="M340.0 80.0 L340.0 135.0" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#a-amber)"/><text x="350.0" y="110.0" font-size="15" text-anchor="start" fill="#d97706">a = −10 m/s²</text><path d="M200.0 110.0 L200.0 60.0" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 5"/><text x="210.0" y="66.0" font-size="15" text-anchor="start" fill="#64748b">altura máxima = ?</text><text x="110.0" y="24.0" font-size="16" text-anchor="start" fill="#334155" font-weight="bold">Lanzamiento vertical desde la mano</text></g></svg>
