<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">Alcance durante una frenada</title><desc id="desc">En t = 0 el coche A pasa por x = 0 a 20 m/s y frena a −2 m/s²; la moto B está en x = −25 m a 15 m/s constantes.</desc>
<defs><marker id="a-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/></marker></defs>
<rect width="480" height="300" fill="#f8fafc"/>
<g font-family="Arial, sans-serif"><path d="M25.0 205.0 L465.0 205.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a-axis)"/><text x="465.0" y="193.0" font-size="17" text-anchor="end" fill="#64748b" font-weight="bold">+x</text><path d="M93.3 199.0 L93.3 211.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="93.3" y="231.0" font-size="17" text-anchor="middle" fill="#334155">−25</text><path d="M226.7 199.0 L226.7 211.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="226.7" y="231.0" font-size="17" text-anchor="middle" fill="#334155">0</text><path d="M226.7 196.0 L226.7 214.0" fill="none" stroke="#64748b" stroke-width="3"/><text x="465.0" y="251.0" font-size="15" text-anchor="end" fill="#64748b">x (m)</text><circle cx="93.3" cy="205.0" r="5.5" fill="#16a34a"/><text x="93.3" y="253.0" font-size="17" text-anchor="middle" fill="#16a34a">B (moto)</text><circle cx="226.7" cy="205.0" r="5.5" fill="#2563eb"/><text x="226.7" y="253.0" font-size="17" text-anchor="middle" fill="#334155">A (coche)</text><path d="M93.3 157.0 L163.3 157.0" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a-green)"/><text x="168.3" y="162.0" font-size="15" text-anchor="start" fill="#16a34a">15 m/s</text><path d="M226.7 127.0 L316.7 127.0" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-blue)"/><text x="321.7" y="132.0" font-size="15" text-anchor="start" fill="#2563eb">20 m/s</text><path d="M286.7 157.0 L226.7 157.0" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#a-amber)"/><text x="292.7" y="162.0" font-size="15" text-anchor="start" fill="#d97706">a = −2 m/s²</text><text x="20.0" y="28.0" font-size="16" text-anchor="start" fill="#334155" font-weight="bold">Carril recto en t = 0</text></g></svg>
