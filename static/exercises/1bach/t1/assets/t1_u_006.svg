<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">La separación entre dos coches</title><desc id="desc">En t = 0 el coche B está en x = −10 m a 10 m/s y el coche A en x = 20 m a 6 m/s, ambos hacia +x.</desc>
<defs><marker id="a-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/></marker></defs>
<rect width="480" height="300" fill="#f8fafc"/>
<g font-family="Arial, sans-serif"><path d="M25.0 190.0 L465.0 190.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a-axis)"/><text x="465.0" y="178.0" font-size="17" text-anchor="end" fill="#64748b" font-weight="bold">+x</text><path d="M106.7 184.0 L106.7 196.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="106.7" y="216.0" font-size="17" text-anchor="middle" fill="#334155">−10</text><path d="M173.3 184.0 L173.3 196.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="173.3" y="216.0" font-size="17" text-anchor="middle" fill="#334155">0</text><path d="M306.7 184.0 L306.7 196.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="306.7" y="216.0" font-size="17" text-anchor="middle" fill="#334155">20</text><path d="M173.3 181.0 L173.3 199.0" fill="none" stroke="#64748b" stroke-width="3"/><text x="465.0" y="236.0" font-size="15" text-anchor="end" fill="#64748b">x (m)</text><circle cx="106.7" cy="190.0" r="5.5" fill="#2563eb"/><text x="106.7" y="238.0" font-size="17" text-anchor="middle" fill="#334155">B</text><circle cx="306.7" cy="190.0" r="5.5" fill="#2563eb"/><text x="306.7" y="238.0" font-size="17" text-anchor="middle" fill="#334155">A</text><circle cx="173.3" cy="190.0" r="5.5" fill="#334155"/><text x="173.3" y="238.0" font-size="17" text-anchor="middle" fill="#334155">peaje</text><path d="M106.7 142.0 L206.7 142.0" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a-green)"/><text x="211.7" y="147.0" font-size="15" text-anchor="start" fill="#16a34a">10 m/s</text><path d="M306.7 142.0 L366.7 142.0" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-blue)"/><text x="371.7" y="147.0" font-size="15" text-anchor="start" fill="#2563eb">6 m/s</text><text x="20.0" y="28.0" font-size="16" text-anchor="start" fill="#334155" font-weight="bold">Autopista en t = 0: los dos van hacia +x</text></g></svg>
