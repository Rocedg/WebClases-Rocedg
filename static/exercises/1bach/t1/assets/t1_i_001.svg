<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">Viaje de tren con horario completo</title><desc id="desc">Esquema de tres tramos: acelera a 0,8 m/s² durante 25 s, mantiene la velocidad 120 s y frena a −1 m/s² hasta parar.</desc>
<defs><marker id="a-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/></marker></defs>
<rect width="480" height="300" fill="#f8fafc"/>
<g font-family="Arial, sans-serif"><text x="20.0" y="28.0" font-size="16" text-anchor="start" fill="#334155" font-weight="bold">Tres tramos del tren (sale del reposo)</text><rect x="30.0" y="110.0" width="130.0" height="90.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="95.0" y="138.0" font-size="16" text-anchor="middle" fill="#2563eb" font-weight="bold">acelera</text><text x="95.0" y="162.0" font-size="15" text-anchor="middle" fill="#334155">0,8 m/s²</text><text x="95.0" y="182.0" font-size="15" text-anchor="middle" fill="#334155">durante 25 s</text><rect x="180.0" y="110.0" width="130.0" height="90.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><text x="245.0" y="138.0" font-size="16" text-anchor="middle" fill="#16a34a" font-weight="bold">crucero</text><text x="245.0" y="162.0" font-size="15" text-anchor="middle" fill="#334155">v constante</text><text x="245.0" y="182.0" font-size="15" text-anchor="middle" fill="#334155">durante 120 s</text><rect x="330.0" y="110.0" width="130.0" height="90.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/><text x="395.0" y="138.0" font-size="16" text-anchor="middle" fill="#d97706" font-weight="bold">frena</text><text x="395.0" y="162.0" font-size="15" text-anchor="middle" fill="#334155">−1 m/s²</text><text x="395.0" y="182.0" font-size="15" text-anchor="middle" fill="#334155">hasta parar</text><path d="M40.0 240.0 L440.0 240.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a-axis)"/><text x="40.0" y="268.0" font-size="15" text-anchor="start" fill="#334155">estación de salida (x = 0)</text><text x="440.0" y="268.0" font-size="17" text-anchor="end" fill="#64748b" font-weight="bold">+x</text></g></svg>
