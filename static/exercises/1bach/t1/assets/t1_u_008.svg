<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">Datos en kilómetros y minutos</title><desc id="desc">Carretera con +x hacia el norte: el autobús pasa por el km 2,4 en t = 0 y por el km 0,9 a los 2,5 min.</desc>
