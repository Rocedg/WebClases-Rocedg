<g font-family="Arial, sans-serif"><path d="M25.0 190.0 L465.0 190.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a-axis)"/><text x="465.0" y="178.0" font-size="17" text-anchor="end" fill="#64748b" font-weight="bold">+x</text><path d="M66.7 184.0 L66.7 196.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="66.7" y="216.0" font-size="17" text-anchor="middle" fill="#334155">km 0</text><path d="M186.7 184.0 L186.7 196.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="186.7" y="216.0" font-size="17" text-anchor="middle" fill="#334155">km 0,9</text><path d="M386.7 184.0 L386.7 196.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="386.7" y="216.0" font-size="17" text-anchor="middle" fill="#334155">km 2,4</text><path d="M66.7 181.0 L66.7 199.0" fill="none" stroke="#64748b" stroke-width="3"/><text x="465.0" y="236.0" font-size="15" text-anchor="end" fill="#64748b">x (m)</text><circle cx="386.7" cy="190.0" r="5.5" fill="#2563eb"/><text x="386.7" y="134.0" font-size="17" text-anchor="middle" fill="#334155">t = 0</text><circle cx="186.7" cy="190.0" r="5.5" fill="#2563eb"/><text x="186.7" y="134.0" font-size="17" text-anchor="middle" fill="#334155">t = 2,5 min</text><path d="M386.7 80.0 L186.7 80.0" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-blue)"/><text x="286.7" y="71.0" font-size="15" text-anchor="middle" fill="#2563eb">autobús</text><text x="465.0" y="70.0" font-size="17" text-anchor="end" fill="#64748b">norte</text><text x="40.0" y="70.0" font-size="17" text-anchor="start" fill="#64748b">sur</text><text x="20.0" y="28.0" font-size="16" text-anchor="start" fill="#334155" font-weight="bold">Carretera recta con puntos kilométricos</text></g></svg>
