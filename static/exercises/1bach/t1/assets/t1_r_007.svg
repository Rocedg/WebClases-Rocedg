<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">Completar la representación que falta</title><desc id="desc">Carrito sobre una mesa en x = 2 m, con +x hacia la derecha; avanza a 3 m/s durante 4 s y después se queda quieto.</desc>
<defs><marker id="a-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/></marker></defs>
<rect width="480" height="300" fill="#f8fafc"/>
<g font-family="Arial, sans-serif"><text x="20.0" y="28.0" font-size="16" text-anchor="start" fill="#334155" font-weight="bold">Mesa larga: el carrito sale de x = 2 m</text><rect x="30.0" y="190.0" width="420.0" height="14.0" rx="3" fill="#cbd5e1" stroke="none" stroke-width="2"/><path d="M25.0 240.0 L465.0 240.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a-axis)"/><text x="465.0" y="228.0" font-size="17" text-anchor="end" fill="#64748b" font-weight="bold">+x</text><path d="M40.0 234.0 L40.0 246.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="40.0" y="266.0" font-size="17" text-anchor="middle" fill="#334155">0</text><path d="M90.0 234.0 L90.0 246.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="90.0" y="266.0" font-size="17" text-anchor="middle" fill="#334155">2</text><path d="M40.0 231.0 L40.0 249.0" fill="none" stroke="#64748b" stroke-width="3"/><text x="465.0" y="286.0" font-size="15" text-anchor="end" fill="#64748b">x (m)</text><rect x="72.0" y="165.0" width="36.0" height="22.0" rx="5" fill="#2563eb" stroke="none" stroke-width="2"/><circle cx="81.0" cy="189.0" r="5" fill="#334155"/><circle cx="99.0" cy="189.0" r="5" fill="#334155"/><path d="M90.0 140.0 L265.0 140.0" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-blue)"/><text x="96.0" y="128.0" font-size="15" text-anchor="start" fill="#2563eb">3 m/s durante 4 s; luego, quieto</text></g></svg>
