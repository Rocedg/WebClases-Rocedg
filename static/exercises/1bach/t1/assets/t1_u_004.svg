<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">Salida retardada y alcance</title><desc id="desc">Línea de salida en x = 0; A sale en t = 0 a 3 m/s y B sale del mismo punto en t = 8 s a 5 m/s.</desc>
<defs><marker id="a-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/></marker></defs>
<rect width="480" height="300" fill="#f8fafc"/>
<g font-family="Arial, sans-serif"><path d="M25.0 190.0 L465.0 190.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a-axis)"/><text x="465.0" y="178.0" font-size="17" text-anchor="end" fill="#64748b" font-weight="bold">+x</text><path d="M70.8 184.0 L70.8 196.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="70.8" y="216.0" font-size="17" text-anchor="middle" fill="#334155">0</text><path d="M70.8 181.0 L70.8 199.0" fill="none" stroke="#64748b" stroke-width="3"/><text x="465.0" y="236.0" font-size="15" text-anchor="end" fill="#64748b">x (m)</text><circle cx="70.8" cy="190.0" r="5.5" fill="#334155"/><text x="70.8" y="238.0" font-size="17" text-anchor="middle" fill="#334155">salida</text><path d="M70.8 112.0 L145.8 112.0" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-blue)"/><text x="150.8" y="117.0" font-size="15" text-anchor="start" fill="#2563eb">A: 3 m/s desde t = 0</text><path d="M70.8 142.0 L180.8 142.0" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a-green)"/><text x="185.8" y="147.0" font-size="15" text-anchor="start" fill="#16a34a">B: 5 m/s desde t = 8 s</text><text x="20.0" y="28.0" font-size="16" text-anchor="start" fill="#334155" font-weight="bold">Pista recta: los dos salen del mismo punto</text></g></svg>
