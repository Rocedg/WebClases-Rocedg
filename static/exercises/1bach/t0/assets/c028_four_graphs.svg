<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 290" role="img" aria-labelledby="title desc">
  <title id="title">Cuatro gráficas posición-tiempo, A, B, C y D</title>
  <desc id="desc">Cuatro gráficas de x frente a t. A: recta horizontal. B: recta que sube. C: recta que baja. D: curva que sube cada vez con más pendiente.</desc>
  <defs>
    <marker markerUnits="userSpaceOnUse" id="axis-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="420" height="290" fill="#fff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <g transform="translate(0 0)">
      <rect x="6" y="6" width="198" height="132" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="18" y="30" font-size="19" font-weight="700" fill="#f97316">A</text>
      <g transform="translate(52 120)">
        <path d="M0 0 H134" stroke="#475569" stroke-width="1.6" marker-end="url(#axis-arrow)"/>
        <path d="M0 0 V-96" stroke="#475569" stroke-width="1.6" marker-end="url(#axis-arrow)"/>
        <path d="M0 -50 H124" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round"/>
        <text x="132" y="12" font-size="13" fill="#111827">t</text><text x="-14" y="-86" font-size="13" fill="#111827">x</text>
      </g>
    </g>
    <g transform="translate(210 0)">
      <rect x="6" y="6" width="198" height="132" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="18" y="30" font-size="19" font-weight="700" fill="#f97316">B</text>
      <g transform="translate(52 120)">
        <path d="M0 0 H134" stroke="#475569" stroke-width="1.6" marker-end="url(#axis-arrow)"/>
        <path d="M0 0 V-96" stroke="#475569" stroke-width="1.6" marker-end="url(#axis-arrow)"/>
        <path d="M0 -14 L124 -82" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round"/>
        <text x="132" y="12" font-size="13" fill="#111827">t</text><text x="-14" y="-86" font-size="13" fill="#111827">x</text>
      </g>
    </g>
    <g transform="translate(0 146)">
      <rect x="6" y="6" width="198" height="132" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="18" y="30" font-size="19" font-weight="700" fill="#f97316">C</text>
      <g transform="translate(52 120)">
        <path d="M0 0 H134" stroke="#475569" stroke-width="1.6" marker-end="url(#axis-arrow)"/>
        <path d="M0 0 V-96" stroke="#475569" stroke-width="1.6" marker-end="url(#axis-arrow)"/>
        <path d="M0 -82 L124 -14" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round"/>
        <text x="132" y="12" font-size="13" fill="#111827">t</text><text x="-14" y="-86" font-size="13" fill="#111827">x</text>
      </g>
    </g>
    <g transform="translate(210 146)">
      <rect x="6" y="6" width="198" height="132" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="18" y="30" font-size="19" font-weight="700" fill="#f97316">D</text>
      <g transform="translate(52 120)">
        <path d="M0 0 H134" stroke="#475569" stroke-width="1.6" marker-end="url(#axis-arrow)"/>
        <path d="M0 0 V-96" stroke="#475569" stroke-width="1.6" marker-end="url(#axis-arrow)"/>
        <path d="M0 -10 Q84 -10 124 -84" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round"/>
        <text x="132" y="12" font-size="13" fill="#111827">t</text><text x="-14" y="-86" font-size="13" fill="#111827">x</text>
      </g>
    </g>
  </g>
</svg>
