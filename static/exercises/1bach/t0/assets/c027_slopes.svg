<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 260" role="img" aria-labelledby="title desc">
  <title id="title">Gráfica posición-tiempo con cuatro tramos rectos</title>
  <desc id="desc">Posición x en metros frente al tiempo t en segundos. Tramo A sube de (0; 0) a (2; 4), tramo B es horizontal de (2; 4) a (5; 4), tramo C baja de (5; 4) a (7; 0) y tramo D sube de (7; 0) a (8; 3).</desc>
  <defs>
    <marker markerUnits="userSpaceOnUse" id="axis-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="430" height="260" fill="#fff"/>
  <g transform="translate(56 214)">
    <g stroke="#e2e8f0" stroke-width="1">
      <path d="M40 0 V-170 M80 0 V-170 M120 0 V-170 M160 0 V-170 M200 0 V-170 M240 0 V-170 M280 0 V-170 M320 0 V-170"/>
      <path d="M0 -40 H340 M0 -80 H340 M0 -120 H340 M0 -160 H340"/>
    </g>
    <path d="M0 0 H344" stroke="#475569" stroke-width="2" marker-end="url(#axis-arrow)"/>
    <path d="M0 0 V-184" stroke="#475569" stroke-width="2" marker-end="url(#axis-arrow)"/>
    <path d="M0 0 L80 -160 L200 -160 L280 0 L320 -120" stroke="#2563eb" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <g fill="#2563eb">
      <circle cx="0" cy="0" r="4"/><circle cx="80" cy="-160" r="4"/><circle cx="200" cy="-160" r="4"/>
      <circle cx="280" cy="0" r="4"/><circle cx="320" cy="-120" r="4"/>
    </g>
    <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#f97316" text-anchor="middle"
       stroke="#fff" stroke-width="4" paint-order="stroke">
      <text x="22" y="-84">A</text>
      <text x="140" y="-170">B</text>
      <text x="258" y="-84">C</text>
      <text x="318" y="-50">D</text>
    </g>
    <g fill="#111827" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" text-anchor="middle">
      <text x="0" y="18">0</text><text x="40" y="18">1</text><text x="80" y="18">2</text><text x="120" y="18">3</text>
      <text x="160" y="18">4</text><text x="200" y="18">5</text><text x="240" y="18">6</text><text x="280" y="18">7</text>
      <text x="320" y="18">8</text>
      <text x="354" y="36">t (s)</text>
    </g>
    <g fill="#111827" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" text-anchor="end">
      <text x="-8" y="-36">1</text><text x="-8" y="-76">2</text><text x="-8" y="-116">3</text><text x="-8" y="-156">4</text>
      <text x="22" y="-190">x (m)</text>
    </g>
  </g>
</svg>
