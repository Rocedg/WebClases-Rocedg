<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">Peso y ejes de un plano inclinado</title><desc id="desc">Eje x sube por la rampa, eje y sale perpendicularmente. El peso apunta verticalmente hacia abajo.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
<rect width="480" height="300" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#334155"><polyline points="40.00,255.00 420.00,255.00 420.00,78.00 40.00,255.00" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/><rect x="217" y="131" width="64" height="38" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2" transform="rotate(-25 249 169)"/><path d="M249 149 L350 102" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="358" y="103" font-size="18" text-anchor="start">+x</text><path d="M249 149 L210 65" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="183" y="57" font-size="18" text-anchor="start">+y</text><path d="M249 149 L249 240" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><text x="263" y="228" font-size="18" text-anchor="start">P = mg</text><path d="M102 255 A62 62 0 0 0 96 229" fill="none" stroke="#64748b" stroke-width="2"/><text x="112" y="243" font-size="18" text-anchor="start">25°</text><text x="305" y="48" font-size="18" text-anchor="start">m = 6,00 kg</text></g></svg>
